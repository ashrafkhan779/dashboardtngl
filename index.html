<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Control · Sales Performance Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#fbf6f1; --panel:#ffffff; --panel-2:#fdf8f3; --ink:#231a12;
  --ink-2:#7a6a5c; --line:#f0e6dc; --line-2:#f6efe8;
  --accent:#f36b1c; --accent-2:#ff9147; --accent-soft:#fde8d6; --accent-ink:#b3480c;
  --pos:#1f7a4d; --pos-soft:#e6f4ec; --neg:#c23a2a; --neg-soft:#fce9e6; --neutral:#a9998b;
  --gold:#1f5f8b; --steel:#1f5f8b;
  --glow:0 0 0 1px rgba(243,107,28,.14),0 8px 30px -8px rgba(243,107,28,.35);
  --shadow:0 1px 2px rgba(70,40,15,.05),0 6px 22px -8px rgba(70,40,15,.14);
  --radius:14px;
}
[data-theme="dark"]{
  --bg:#0e0b09; --panel:#1a1512; --panel-2:#14100d; --ink:#f4ede6; --ink-2:#b0a094;
  --line:#2c231d; --line-2:#221a15;
  --accent:#ff7d33; --accent-2:#ffa15c; --accent-soft:#3a1f0d; --accent-ink:#ffb684;
  --pos:#4cc38a; --pos-soft:#122a1c; --neg:#f0837a; --neg-soft:#2e1613; --neutral:#8a7a6c;
  --gold:#5aa9dd; --steel:#5aa9dd;
  --glow:0 0 0 1px rgba(255,125,51,.2),0 10px 34px -8px rgba(255,125,51,.4);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums}
h1,h2,h3,.disp{font-family:'Sora',sans-serif;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
select,input{font-family:inherit;font-size:13px}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}

/* ---------- Layout ---------- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--panel);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent-ink));display:grid;place-items:center;color:#fff;font-family:'Sora';font-weight:700;font-size:15px}
.brand .name{font-family:'Sora';font-weight:600;font-size:15px;line-height:1.1}
.brand .sub{font-size:11px;color:var(--ink-2);margin-top:2px;letter-spacing:.02em}
.nav{padding:10px 12px;flex:1}
.nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:.09em;color:var(--neutral);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink-2);font-weight:500;font-size:13px;cursor:pointer;transition:.12s}
.nav a:hover{background:var(--line-2);color:var(--ink)}
.nav a.active{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav a .ic{width:16px;text-align:center;opacity:.85}
.side-foot{padding:14px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--neutral)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.topbar .title{font-family:'Sora';font-weight:600;font-size:17px;margin-right:auto}
.topbar .title small{display:block;font-family:'Inter';font-weight:400;font-size:11px;color:var(--ink-2);margin-top:1px}
.iconbtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;background:var(--panel)}
.iconbtn:hover{background:var(--line-2)}

/* Filter bar */
.filterbar{background:var(--panel-2);border-bottom:1px solid var(--line);padding:10px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fitem{display:flex;flex-direction:column;gap:3px}
.fitem label{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--neutral);font-weight:600}
.fitem select,.fitem input{padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);min-width:110px}
.fitem select[multiple]{min-height:34px}
.chip{background:var(--accent-soft);color:var(--accent-ink);padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:5px}
.filtsum{font-size:12px;color:var(--ink-2);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-right:auto}
.btn{padding:7px 13px;border-radius:8px;font-size:12.5px;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--line-2)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.danger{color:var(--neg);border-color:var(--neg-soft)}
.btn.danger:hover{background:var(--neg-soft)}

.page{padding:22px 24px 60px;display:none}
.page.active{display:block}
.pagehead{margin-bottom:16px}
.pagehead h2{font-size:20px;font-weight:600}
.pagehead p{color:var(--ink-2);font-size:13px;margin-top:2px}

/* ---------- KPI cards ---------- */
.kpigrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{font-family:'Sora';font-weight:600;font-size:26px;margin-top:8px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .delta{margin-top:7px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;font-family:'IBM Plex Mono'}
.kpi .delta .sub{color:var(--ink-2);font-weight:400}
.up{color:var(--pos)}.down{color:var(--neg)}.flat{color:var(--neutral)}
.kpi .accent-bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card .head{padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .head h3{font-size:14px;font-weight:600}
.card .head .hint{font-size:11px;color:var(--neutral)}
.card .body{padding:16px}
.card .body.pad0{padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{padding:5px 10px;font-size:11.5px;font-weight:500;color:var(--ink-2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent);color:#fff}
.chart-wrap{position:relative;height:300px}
.chart-wrap.tall{height:360px}
.chart-wrap.sm{height:230px}

/* ---------- Tables ---------- */
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--panel-2);text-align:left;padding:9px 14px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-2);font-weight:600;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none}
thead th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;font-family:'IBM Plex Mono'}
tbody td{padding:9px 14px;border-bottom:1px solid var(--line-2);white-space:nowrap}
tbody tr:hover{background:var(--panel-2)}
tbody tr.clickable{cursor:pointer}
.tablescroll{max-height:440px;overflow:auto}
.rankcell{color:var(--neutral);font-weight:600;font-family:'IBM Plex Mono'}
.pill{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.pill.pos{background:var(--pos-soft);color:var(--pos)}.pill.neg{background:var(--neg-soft);color:var(--neg)}.pill.neu{background:var(--line-2);color:var(--ink-2)}
.bar-cell{position:relative}
.bar-cell .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent-soft);z-index:0}
.bar-cell span{position:relative;z-index:1}

/* forms / modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,14,20,.5);backdrop-filter:blur(2px);display:none;place-items:center;z-index:100}
.modal-bg.open{display:grid}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,92vw);max-height:88vh;overflow:auto;border:1px solid var(--line)}
.modal .mhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.modal .mbody{padding:20px}
.modal .mfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.full{grid-column:1/-1}
.field label{font-size:11px;font-weight:600;color:var(--ink-2)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);color:var(--ink)}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--ink-2)}
.empty .ico{font-size:34px;opacity:.5;margin-bottom:10px}
.empty h4{font-family:'Sora';font-size:15px;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13px;max-width:380px;margin:0 auto 16px}

/* toast */
#toast{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--ink);color:var(--panel);padding:11px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .25s;display:flex;gap:9px;align-items:center}
.toast.ok{background:var(--pos)}.toast.warn{background:var(--gold)}
@keyframes tin{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}

.audit-flag{display:flex;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--panel)}
.audit-flag .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.audit-flag.fix .dot{background:var(--pos)}.audit-flag.note .dot{background:var(--gold)}.audit-flag.info .dot{background:var(--accent)}
.audit-flag .t{font-weight:600;font-size:13px}
.audit-flag .d{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.map-tbl td,.map-tbl th{font-size:12.5px}
.tag{font-family:'IBM Plex Mono';font-size:11.5px;background:var(--line-2);padding:2px 7px;border-radius:5px;color:var(--accent-ink)}

.subgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--panel-2);border:1px solid var(--line-2);border-radius:10px;padding:12px 14px}
.stat .l{font-size:11px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.stat .v{font-family:'Sora';font-weight:600;font-size:18px;margin-top:5px;font-variant-numeric:tabular-nums}

.notice{font-size:12px;color:var(--ink-2);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);color:var(--accent-ink);padding:9px 12px;border-radius:8px;margin-bottom:14px;display:flex;gap:8px}
.two-search{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.searchbox{flex:1;min-width:240px}
.searchbox label{font-size:11px;font-weight:600;color:var(--ink-2);display:block;margin-bottom:4px}
.searchbox select{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}

@media(max-width:1100px){.g2,.g3{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}.side{position:fixed;left:-240px;z-index:60;transition:.2s;width:230px}.side.open{left:0}.menu-btn{display:grid!important}}
.menu-btn{display:none}
/* ===== FUTURISTIC / LOGISTICS LAYER ===== */
body{background:
  radial-gradient(1200px 600px at 110% -10%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 60%),
  radial-gradient(900px 500px at -10% 110%, color-mix(in srgb,var(--steel) 8%,transparent), transparent 55%),
  var(--bg);background-attachment:fixed}
.brand{background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 10%,var(--panel)),var(--panel))}
.brand .mark{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:var(--glow);overflow:hidden}
.brand .mark img{width:100%;height:100%;object-fit:cover}
.brand .mark::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{transform:translateX(-120%)}80%,100%{transform:translateX(120%)}}
.mark{position:relative}
.logo-edit{font-size:10px;color:var(--accent-ink);cursor:pointer;margin-top:6px;display:inline-flex;gap:4px;align-items:center;font-weight:600;opacity:.85}
.logo-edit:hover{opacity:1;text-decoration:underline}
.nav a{position:relative}
.nav a.active{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.nav a.active::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--accent),var(--accent-2));box-shadow:0 0 10px color-mix(in srgb,var(--accent) 60%,transparent)}
.nav a .ic svg{width:17px;height:17px;display:block}
.iconbtn,.btn{transition:transform .12s,box-shadow .12s,background .12s}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent-2));box-shadow:0 6px 16px -6px color-mix(in srgb,var(--accent) 70%,transparent)}
.btn.pri:hover{transform:translateY(-1px);box-shadow:0 10px 22px -6px color-mix(in srgb,var(--accent) 75%,transparent)}
.kpi{transition:transform .18s,box-shadow .18s;background:linear-gradient(160deg,var(--panel),color-mix(in srgb,var(--accent) 4%,var(--panel)))}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--glow)}
.kpi .accent-bar{width:100%;height:3px;bottom:auto;background:linear-gradient(90deg,var(--accent),var(--accent-2),transparent)}
.kpi .val{background:linear-gradient(120deg,var(--ink),color-mix(in srgb,var(--accent-ink) 55%,var(--ink)));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kpi .ico-badge{position:absolute;right:14px;top:14px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink);opacity:.9}
.kpi .ico-badge svg{width:17px;height:17px}
.card{transition:box-shadow .18s;backdrop-filter:blur(2px)}
.card:hover{box-shadow:var(--glow)}
.card .head h3{display:flex;align-items:center;gap:8px}
.card .head h3 .hic{color:var(--accent);display:inline-flex}
.card .head h3 .hic svg{width:16px;height:16px}
.topbar .title{background:none}
.mode-legend{display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.mode-legend .row{display:flex;align-items:center;gap:9px;font-size:12.5px}
.mode-legend .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:none}
.mode-legend .ic svg{width:15px;height:15px}
.mode-legend .nm{font-weight:600}
.mode-legend .vv{margin-left:auto;font-family:'IBM Plex Mono';font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* custom multiselect */
.msel{position:relative}
.msel-btn{padding:6px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);min-width:132px;display:flex;align-items:center;gap:6px;font-size:13px;justify-content:space-between}
.msel-btn:hover{border-color:var(--accent)}
.msel-btn .cnt{background:var(--accent);color:#fff;border-radius:20px;font-size:10px;padding:1px 6px;font-weight:700}
.msel-btn .car{color:var(--neutral);font-size:10px}
.msel-panel{position:absolute;z-index:50;top:calc(100% + 5px);left:0;min-width:190px;max-height:280px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:none}
.msel.open .msel-panel{display:block}
.msel-opt{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;font-size:13px;cursor:pointer}
.msel-opt:hover{background:var(--accent-soft)}
.msel-opt input{accent-color:var(--accent);width:15px;height:15px}
.msel-opt.all{border-bottom:1px solid var(--line-2);border-radius:0;margin-bottom:4px;font-weight:700;color:var(--accent-ink)}

/* year compare table */
.cmp-tbl th.yr{text-align:right;color:var(--accent-ink)}
.cmp-tbl td.metric{font-weight:600;text-align:left}
.delta-inline{font-family:'IBM Plex Mono';font-size:11px;font-weight:600;margin-left:8px}
.yearcol-pick{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.yearcol-pick .field{min-width:120px}
@media(prefers-reduced-motion:reduce){.brand .mark::after{animation:none}}

</head>
<body>
<div id="bootScreen"><div style="text-align:center"><div class="spin"></div><div style="color:var(--ink-2);font-size:13px">Loading dashboard…</div></div></div>
<div id="toast"></div>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand">
      <div class="logo">
        <div class="mark" id="brandMark" title="Upload logo">ET</div>
        <div><div class="name">Finance Control</div><div class="sub">Logistics · Sales · Cash</div></div>
      </div>
      <div class="logo-edit" id="logoEdit">⤒ Upload logo</div>
      <input type="file" id="logoInput" accept="image/*" hidden>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">Analytics</div>
      <a data-page="exec" class="active"><span class="ic" data-i="grid"></span> Dashboard</a>
      <a data-page="customers"><span class="ic" data-i="user"></span> Customer Analysis</a>
      <a data-page="salespeople"><span class="ic" data-i="chart"></span> Salesperson Performance</a>
      <div class="grp">Finance</div>
      <a data-page="pnl"><span class="ic" data-i="pnl"></span> Profit &amp; Loss</a>
      <a data-page="expenses"><span class="ic" data-i="receipt"></span> Operational Expenses</a>
      <a data-page="banks"><span class="ic" data-i="bank"></span> Bank Management</a>
      <a data-page="cashflow"><span class="ic" data-i="cash"></span> Cash Flow Control</a>
      <div class="grp">Data</div>
      <a data-page="data"><span class="ic" data-i="db"></span> Data &amp; Audit</a>
    </nav>
    <div class="side-foot" id="foot"></div>
  </aside>

  <!-- MAIN -->
  <div class="main">
    <div class="topbar">
      <button class="iconbtn menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
      <div class="title" id="pageTitle">Dashboard<small id="pageSub">Company-wide sales & profitability</small></div>
      <button class="btn sm" id="exportBtn">⭳ Export</button>
      <button class="iconbtn" id="themeBtn" title="Toggle theme">◐</button>
    </div>

    <!-- GLOBAL FILTERS -->
    <div class="filterbar" id="filterbar">
      <div class="fitem"><label>Year</label><div class="msel" id="mYear"></div></div>
      <div class="fitem"><label>Quarter</label><select id="fQuarter"><option value="">All</option><option>Q1</option><option>Q2</option><option>Q3</option><option>Q4</option></select></div>
      <div class="fitem"><label>Month</label><select id="fMonth"><option value="">All</option></select></div>
      <div class="fitem"><label>Mode</label><div class="msel" id="mMode"></div></div>
      <div class="fitem"><label>Salesperson</label><div class="msel" id="mSales"></div></div>
      <div class="fitem"><label>Customer</label><select id="fCust"><option value="">All customers</option></select></div>
      <button class="btn sm" id="resetFilters">↺ Reset</button>
    </div>
    <div class="filterbar" style="padding-top:6px;padding-bottom:6px">
      <div class="filtsum" id="filtSummary"></div>
      <span class="chip" id="recChip"></span>
    </div>

    <!-- PAGES -->
    <div class="page active" id="page-exec"></div>
    <div class="page" id="page-customers"></div>
    <div class="page" id="page-salespeople"></div>
    <div class="page" id="page-pnl"></div>
    <div class="page" id="page-expenses"></div>
    <div class="page" id="page-banks"></div>
    <div class="page" id="page-cashflow"></div>
    <div class="page" id="page-data"></div>
  </div>
</div>

<!-- generic modal -->
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   EMBEDDED CLEANED DATASET (injected from source workbook)
   ============================================================ */
function startApp(){
const DB = window.__DATA;

/* index constants for row arrays */
const I={inv:0,date:1,c:2,m:3,s:4,yr:5,mo:6,q:7,rev:8,cost:9,profit:10};
const ROWS=DB.rows, CUST=DB.customers, MODES=DB.modes, SP=DB.salespeople, MON=DB.months;

/* ---------- helpers ---------- */
const AED=v=>(v<0?'-':'')+'AED '+Math.abs(v).toLocaleString('en-US',{maximumFractionDigits:0});
const AED2=v=>'AED '+v.toLocaleString('en-US',{maximumFractionDigits:0});
const num=v=>v.toLocaleString('en-US',{maximumFractionDigits:0});
const pct=v=>(v*100).toFixed(1)+'%';
const pctS=v=>(v>=0?'+':'')+(v*100).toFixed(1)+'%';
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const $=s=>document.querySelector(s);
function toast(msg,kind){const t=el('div','toast '+(kind||''),msg);$('#toast').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),250)},2600);}
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}

/* ---------- persistent store (localStorage) ---------- */
const STORE={
  read(k,def){try{const v=localStorage.getItem('fc_'+k);return v?JSON.parse(v):def;}catch(e){return def;}},
  write(k,v){localStorage.setItem('fc_'+k,JSON.stringify(v));}
};

/* ---------- SVG icon library (stroke uses currentColor) ---------- */
const SVG={
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.8 19.2 16 11l3.5-3.5a2.1 2.1 0 0 0-3-3L13 8 4.8 6.2a.5.5 0 0 0-.5.8l3.9 3.9-2.2 2.2-2-.4a.5.5 0 0 0-.5.8L5 18l1.5 1.9a.5.5 0 0 0 .8-.1l2.2-2.2 3.9 3.9a.5.5 0 0 0 .8-.5Z"/></svg>',
  ship:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 21c.6.5 1.2 1 2.5 1 2.5 0 2.5-2 5-2 2.6 0 2.4 2 5 2 2.5 0 2.5-2 5-2 1.3 0 1.9.5 2.5 1"/><path d="M19.4 14 21 9H3l1.6 5"/><path d="M12 3v6M8 9V6h8v3"/><path d="M12 10v8"/></svg>',
  truck:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 17V5a1 1 0 0 0-1-1H2v13"/><path d="M14 9h4l3 3v5h-2"/><circle cx="6.5" cy="17.5" r="2"/><circle cx="17.5" cy="17.5" r="2"/><path d="M9 17.5h5"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>',
  customs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>',
  road:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21 8 3M20 21 16 3M12 5v2M12 11v2M12 17v2"/></svg>',
  globe:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18Z"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16v-7"/></svg>',
  pnl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m7 14 3-3 3 3 5-6"/></svg>',
  receipt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 2v20l2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1Z"/><path d="M9 7h6M9 11h6"/></svg>',
  bank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-6 9 6M4 10v8M9 10v8M15 10v8M20 10v8M3 21h18"/></svg>',
  cash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/><path d="M6 12h.01M18 12h.01"/></svg>',
  db:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>',
  money:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  margin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5 5 19M6.5 8a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3ZM17.5 19a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"/></svg>',
  invoice:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>'
};
function modeIcon(name){const n=name.toUpperCase();
  if(n.includes('AIR'))return SVG.plane;
  if(n.includes('SEA'))return SVG.ship;
  if(n.includes('TRUCK'))return SVG.truck;
  if(n.includes('ROAD')||n.includes('LAND'))return SVG.road;
  if(n.includes('COURIER'))return SVG.box;
  if(n.includes('CLEAR'))return SVG.customs;
  return SVG.globe;}

/* logo upload */
function initLogo(){
  const saved=STORE.read('logo',null);
  if(saved)$('#brandMark').innerHTML='<img src="'+saved+'">';
  const trigger=()=>$('#logoInput').click();
  $('#brandMark').onclick=trigger;$('#logoEdit').onclick=trigger;
  $('#logoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{STORE.write('logo',rd.result);$('#brandMark').innerHTML='<img src="'+rd.result+'">';toast('Logo updated','ok');};rd.readAsDataURL(f);};
}

/* datalabels: registered globally but off by default; enabled per-chart */
if(window.ChartDataLabels){Chart.register(window.ChartDataLabels);}


/* ============================================================
   FILTER STATE + ENGINE
   ============================================================ */
const F={years:[],quarter:'',month:'',modes:[],sales:[],customer:''};
function passes(r){
  if(F.years.length && !F.years.includes(r[I.yr]))return false;
  if(F.quarter && r[I.q]!==F.quarter)return false;
  if(F.month!=='' && r[I.mo]!=+F.month)return false;
  if(F.modes.length && !F.modes.includes(r[I.m]))return false;
  if(F.sales.length && !F.sales.includes(r[I.s]))return false;
  if(F.customer!=='' && r[I.c]!=+F.customer)return false;
  return true;
}
function filtered(){return ROWS.filter(passes);}
/* rows for a set of years ignoring the year filter (for YoY compares) */
function rowsForYear(y,extra){return ROWS.filter(r=>{
  if(r[I.yr]!==y)return false;
  if(F.quarter && r[I.q]!==F.quarter)return false;
  if(F.month!=='' && r[I.mo]!=+F.month)return false;
  if(F.modes.length && !F.modes.includes(r[I.m]))return false;
  if(F.sales.length && !F.sales.includes(r[I.s]))return false;
  if(F.customer!=='' && r[I.c]!=+F.customer)return false;
  if(extra&&!extra(r))return false;
  return true;
});}
const YEARS=[...new Set(ROWS.map(r=>r[I.yr]))].sort();
function agg(rows){let rev=0,cost=0,pf=0;const inv=new Set();for(const r of rows){rev+=r[I.rev];cost+=r[I.cost];pf+=r[I.profit];inv.add(r[I.inv]);}return{rev,cost,pf,gp:rev?pf/rev:0,inv:inv.size,n:rows.length};}

/* current-scope reference year = max year in filter (or dataset max) */
function refYear(){return F.years.length?Math.max(...F.years):Math.max(...YEARS);}

/* ============================================================
   FILTER UI
   ============================================================ */
/* build a custom multiselect with an "All" option */
function buildMsel(hostId,items,onChange){
  const host=$('#'+hostId);
  host.innerHTML=`<button class="msel-btn" type="button"><span class="lbl">All</span><span class="car">▾</span></button>
    <div class="msel-panel"><label class="msel-opt all"><input type="checkbox" class="allbox" checked> All</label>
    ${items.map((t,i)=>`<label class="msel-opt"><input type="checkbox" value="${i}"> ${t}</label>`).join('')}</div>`;
  const btn=host.querySelector('.msel-btn'),panel=host.querySelector('.msel-panel'),lbl=host.querySelector('.lbl');
  const allbox=host.querySelector('.allbox'),boxes=Array.from(host.querySelectorAll('.msel-opt:not(.all) input'));
  btn.onclick=e=>{e.stopPropagation();document.querySelectorAll('.msel').forEach(m=>{if(m!==host)m.classList.remove('open');});host.classList.toggle('open');};
  panel.onclick=e=>e.stopPropagation();
  function sync(){const sel=boxes.filter(b=>b.checked).map(b=>+b.value);
    allbox.checked=sel.length===0;
    if(sel.length===0)lbl.innerHTML='All';
    else lbl.innerHTML=(sel.length<=2?sel.map(i=>items[i]).join(', '):sel.length+' selected')+` <span class="cnt">${sel.length}</span>`;
    onChange(sel);}
  allbox.onclick=()=>{boxes.forEach(b=>b.checked=false);sync();};
  boxes.forEach(b=>b.onchange=sync);
  host._reset=()=>{boxes.forEach(b=>b.checked=false);sync();};
  return host;
}
function initFilters(){
  // nav icons
  document.querySelectorAll('.nav .ic[data-i]').forEach(s=>{s.innerHTML=SVG[s.dataset.i]||'';});
  const fm=$('#fMonth');MON.forEach((m,i)=>{const o=el('option');o.value=i;o.textContent=m;fm.appendChild(o);});
  const fc=$('#fCust');CUST.map((c,i)=>[c,i]).sort((a,b)=>a[0].localeCompare(b[0])).forEach(([c,i])=>{const o=el('option');o.value=i;o.textContent=c;fc.appendChild(o);});

  buildMsel('mYear',YEARS.map(String),sel=>{F.years=sel.map(i=>YEARS[i]);render();});
  buildMsel('mMode',MODES,sel=>{F.modes=sel;render();});
  buildMsel('mSales',SP,sel=>{F.sales=sel;render();});

  $('#fQuarter').onchange=e=>{F.quarter=e.target.value;render();};
  fm.onchange=e=>{F.month=e.target.value;render();};
  fc.onchange=e=>{F.customer=e.target.value;render();};
  document.addEventListener('click',()=>document.querySelectorAll('.msel').forEach(m=>m.classList.remove('open')));
  $('#resetFilters').onclick=()=>{F.years=[];F.quarter='';F.month='';F.modes=[];F.sales=[];F.customer='';
    ['mYear','mMode','mSales'].forEach(id=>$('#'+id)._reset&&$('#'+id)._reset());$('#fQuarter').value='';fm.value='';fc.value='';render();};
}
function filterSummary(){
  const s=$('#filtSummary');s.innerHTML='';
  const chips=[];
  if(F.years.length)chips.push('Years: '+F.years.join(', '));
  if(F.quarter)chips.push(F.quarter);
  if(F.month!=='')chips.push(MON[+F.month]);
  if(F.modes.length)chips.push('Mode: '+F.modes.map(i=>MODES[i]).join(', '));
  if(F.sales.length)chips.push('Rep: '+F.sales.map(i=>SP[i]).join(', '));
  if(F.customer!=='')chips.push('Customer: '+CUST[+F.customer]);
  if(!chips.length){s.innerHTML='<span style="color:var(--neutral)">No filters — showing all '+num(ROWS.length)+' invoices ('+DB.meta.date_min+' → '+DB.meta.date_max+')</span>';return;}
  chips.forEach(c=>{const sp=el('span','chip');sp.textContent=c;s.appendChild(sp);});
}

/* ============================================================
   CHART MANAGEMENT
   ============================================================ */
const CHARTS={};
function mkChart(id,cfg){if(CHARTS[id]){CHARTS[id].destroy();}const ctx=document.getElementById(id);if(!ctx)return;
  Chart.defaults.font.family="'Inter',sans-serif";Chart.defaults.color=css('--ink-2');Chart.defaults.font.size=11.5;
  cfg.options=cfg.options||{};cfg.options.plugins=cfg.options.plugins||{};
  if(!cfg.options.plugins.datalabels)cfg.options.plugins.datalabels={display:false};
  CHARTS[id]=new Chart(ctx,cfg);return CHARTS[id];}
const PAL={accent:()=>css('--accent'),pos:()=>css('--pos'),neg:()=>css('--neg'),gold:()=>css('--gold'),steel:()=>css('--steel'),ink:()=>css('--ink'),grid:()=>css('--line-2')};
const modePalette=['#f36b1c','#1f5f8b','#e8a13c','#5a8f6b','#8a5b8f','#c94f3d','#2c7a7b','#b07a2e'];
const kfmt=v=>Math.abs(v)>=1e6?(v/1e6).toFixed(1)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(0)+'K':Math.round(v);
function gridOpt(){return{grid:{color:PAL.grid()},ticks:{color:css('--ink-2')}};}
/* reusable datalabels config for value labels on bars */
function dl(color,fmt){return{display:true,anchor:'end',align:'end',clamp:true,offset:2,color:color||css('--ink-2'),font:{family:"'IBM Plex Mono'",size:10,weight:'600'},formatter:fmt||(v=>v?kfmt(v):'')};}

/* ============================================================
   PAGE: EXECUTIVE
   ============================================================ */
function renderExec(){
  const p=$('#page-exec');const rows=filtered();const a=agg(rows);
  const ry=refYear(),py=ry-1;
  const cur=agg(rowsForYear(ry)),prev=agg(rowsForYear(py));
  const hasPrev=prev.n>0;
  function delta(c,pv,invert){const d=c-pv;const pc=pv?d/pv:0;const good=invert?d<0:d>0;
    if(!hasPrev)return '<span class="delta flat">— no '+py+' baseline</span>';
    const cls=d===0?'flat':(good?'up':'down');const ar=d>0?'▲':(d<0?'▼':'▪');
    return `<span class="delta ${cls}">${ar} ${pctS(pc)} <span class="sub">vs ${py}</span></span>`;}

  p.innerHTML=`
   <div class="notice">◆ KPIs compare the scope's reference year <b>${ry}</b> against <b>${py}</b>. Adjust the Year filter to reframe the comparison. Data reflects all active slicers.</div>
   <div class="kpigrid">
     ${kpi('Total Sales',AED2(a.rev),delta(cur.rev,prev.rev),'money')}
     ${kpi('Cost of Goods Sold',AED2(a.cost),delta(cur.cost,prev.cost,true),'box')}
     ${kpi('Gross Profit',AED2(a.pf),delta(cur.pf,prev.pf),'pnl')}
     ${kpi('Gross Margin',pct(a.gp),(hasPrev?`<span class="delta ${cur.gp>=prev.gp?'up':'down'}">${cur.gp>=prev.gp?'▲':'▼'} ${((cur.gp-prev.gp)*100).toFixed(1)} pts <span class="sub">vs ${py}</span></span>`:'<span class="delta flat">—</span>'),'margin')}
     ${kpi('Invoices',num(a.inv),delta(cur.inv,prev.inv),'invoice')}
   </div>

   <div class="grid g3" style="margin-bottom:16px">
     <div class="card">
       <div class="head"><h3><span class="hic">${SVG.chart}</span>Yearly Performance</h3>
         <div class="seg" id="yrMetric"><button class="on" data-k="rev">Sales</button><button data-k="pf">Gross Profit</button><button data-k="inv">Invoices</button></div></div>
       <div class="body"><div class="chart-wrap"><canvas id="cYear"></canvas></div></div>
     </div>
     <div class="card">
       <div class="head"><h3><span class="hic">${SVG.globe}</span>Sales by Mode</h3><span class="hint">click to filter</span></div>
       <div class="body"><div style="display:flex;gap:8px;align-items:center"><div class="chart-wrap" style="flex:1;height:250px"><canvas id="cMode"></canvas></div><div class="mode-legend" id="modeLegend"></div></div></div>
     </div>
   </div>

   <div class="grid g2" style="margin-bottom:16px">
     <div class="card">
       <div class="head"><h3>Monthly Trend — Sales vs Gross Profit</h3>
         <div class="seg" id="trendYr"></div></div>
       <div class="body"><div class="chart-wrap"><canvas id="cTrend"></canvas></div></div>
     </div>
     <div class="card">
       <div class="head"><h3>Profit Bridge</h3><span class="hint">scope totals</span></div>
       <div class="body"><div class="chart-wrap"><canvas id="cBridge"></canvas></div></div>
     </div>
   </div>

   <div class="grid g2">
     <div class="card">
       <div class="head"><h3>Top 20 Customers by Sales</h3><span class="hint">click a row → Customer Analysis</span></div>
       <div class="body pad0"><div class="tablescroll" id="topCustTbl"></div></div>
     </div>
     <div class="card">
       <div class="head"><h3>Salesperson Summary</h3></div>
       <div class="body pad0"><div class="tablescroll" id="spSummary"></div></div>
     </div>
   </div>`;

  // yearly chart
  let yrK='rev';
  function drawYear(){
    const labels=YEARS,data=YEARS.map(y=>{const g=agg(rowsForYear(y));return yrK==='rev'?g.rev:yrK==='pf'?g.pf:g.inv;});
    mkChart('cYear',{type:'bar',data:{labels,datasets:[{data,backgroundColor:labels.map(y=>y===ry?PAL.accent():css('--accent-soft')),borderColor:PAL.accent(),borderWidth:labels.map(y=>y===ry?0:1),borderRadius:5}]},
      options:{maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{display:false},datalabels:dl(css('--accent-ink'),v=>yrK==='inv'?num(v):kfmt(v)),tooltip:{callbacks:{label:c=>yrK==='inv'?num(c.raw)+' invoices':AED2(c.raw)}}},
        scales:{y:{...gridOpt(),ticks:{color:css('--ink-2'),callback:v=>yrK==='inv'?num(v):(v/1e6).toFixed(1)+'M'}},x:gridOpt()}}});
  }
  drawYear();
  $('#yrMetric').querySelectorAll('button').forEach(b=>b.onclick=()=>{$('#yrMetric').querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');yrK=b.dataset.k;drawYear();});

  // mode donut + logistics legend
  const modeAgg=MODES.map((m,i)=>({m,i,v:agg(rows.filter(r=>r[I.m]===i)).rev})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  mkChart('cMode',{type:'doughnut',data:{labels:modeAgg.map(x=>x.m),datasets:[{data:modeAgg.map(x=>x.v),backgroundColor:modeAgg.map(x=>modePalette[x.i%modePalette.length]),borderColor:css('--panel'),borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:'60%',plugins:{legend:{display:false},datalabels:{display:c=>c.dataset.data[c.dataIndex]/a.rev>0.06,color:'#fff',font:{size:10,weight:'700'},formatter:v=>pct(v/a.rev)},tooltip:{callbacks:{label:c=>c.label+': '+AED2(c.raw)+' ('+pct(c.raw/a.rev)+')'}}},
      onClick:(e,els)=>{if(els.length){const idx=modeAgg[els[0].index].i;const box=document.querySelector('#mMode .msel-opt input[value="'+idx+'"]');if(box){box.checked=true;box.dispatchEvent(new Event('change'));}toast('Filtered to mode: '+MODES[idx]);}}}});
  $('#modeLegend').innerHTML=modeAgg.map(x=>`<div class="row"><div class="ic" style="background:${modePalette[x.i%modePalette.length]}">${modeIcon(x.m)}</div><span class="nm">${x.m}</span><span class="vv">${AED2(x.v)} · ${pct(x.v/a.rev)}</span></div>`).join('');

  // trend
  const ty=$('#trendYr');
  // build year selector for trend
  let selTrendYear=ry;
  YEARS.forEach(y=>{const b=el('button',y===selTrendYear?'on':'');b.textContent=y;b.onclick=()=>{selTrendYear=y;ty.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');drawTrend();};ty.appendChild(b);});
  function drawTrend(){
    const monthsRev=MON.map((_,mi)=>agg(rowsForYear(selTrendYear,r=>r[I.mo]===mi)).rev);
    const monthsPf=MON.map((_,mi)=>agg(rowsForYear(selTrendYear,r=>r[I.mo]===mi)).pf);
    mkChart('cTrend',{data:{labels:MON,datasets:[
      {type:'bar',label:'Sales',data:monthsRev,backgroundColor:css('--accent-soft'),borderColor:PAL.accent(),borderWidth:1,borderRadius:4,order:2},
      {type:'line',label:'Gross Profit',data:monthsPf,borderColor:PAL.gold(),backgroundColor:PAL.gold(),tension:.35,pointRadius:2.5,order:1}]},
      options:{maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12}},tooltip:{callbacks:{label:c=>c.dataset.label+': '+AED2(c.raw)}}},
        scales:{y:{...gridOpt(),ticks:{color:css('--ink-2'),callback:v=>(v/1e3).toFixed(0)+'K'}},x:gridOpt()}}});
  }

function customerStats(cIdx,year){
  const rows=ROWS.filter(r=>r[I.c]===cIdx && (!F.modes.length||F.modes.includes(r[I.m])) && (!F.sales.length||F.sales.includes(r[I.s])) && (year==null||r[I.yr]===year));
  return agg(rows);
}

  const opts=CUST.map((c,i)=>({c,i})).sort((a,b)=>a.c.localeCompare(b.c)).map(x=>`<option value="${x.i}">${x.c}</option>`).join('');

function drawCustomer(cv,years,ranked){
  const body=$('#custBody');
  if(cv===''){body.innerHTML='<div class="empty"><div class="ico">◎</div><h4>Select a customer to begin</h4></div>';return;}
  const c=+cv;if(!years.length)years=[Math.max(...YEARS)];
  const all=customerStats(c,null);
  const rank=ranked.indexOf(c)+1;
  const compTotal=agg(ROWS);
  const custRows=ROWS.filter(r=>r[I.c]===c).sort((a,b)=>a[I.date]<b[I.date]?1:-1);
  const first=custRows.length?custRows[custRows.length-1][I.date]:'—',last=custRows.length?custRows[0][I.date]:'—';
  const stats=years.map(y=>({y,s:customerStats(c,y)}));

  // metric rows definition
  const metrics=[
    {k:'Sales',get:s=>s.rev,fmt:AED2,dir:1},
    {k:'Cost of Goods Sold',get:s=>s.cost,fmt:AED2,dir:0},
    {k:'Gross Profit',get:s=>s.pf,fmt:AED2,dir:1},
    {k:'Gross Margin %',get:s=>s.gp,fmt:pct,pts:true,dir:1},
    {k:'Invoices',get:s=>s.inv,fmt:num,dir:1},
    {k:'Avg Invoice Value',get:s=>s.inv?s.rev/s.inv:0,fmt:AED2,dir:1}
  ];
  function inlineDelta(m,cur,prev){
    if(m.pts){const diff=(cur-prev)*100;const cls=diff===0?'flat':(diff>0?'up':'down');return `<span class="delta-inline ${cls}">${diff>0?'▲':diff<0?'▼':'▪'}${Math.abs(diff).toFixed(1)}pt</span>`;}
    const diff=cur-prev;const pc=prev?diff/prev:0;const cls=m.dir===0?'flat':(diff===0?'flat':diff>0?'up':'down');
    return `<span class="delta-inline ${cls}">${diff>0?'▲':diff<0?'▼':'▪'}${prev?pctS(pc).replace('+',''):'—'}</span>`;
  }
  let cmpRows='';
  metrics.forEach(m=>{
    cmpRows+=`<tr><td class="metric">${m.k}</td>`;
    stats.forEach((st,j)=>{const val=m.get(st.s);const prev=j>0?m.get(stats[j-1].s):null;
      cmpRows+=`<td class="num">${m.fmt(val)}${j>0?inlineDelta(m,val,prev):''}</td>`;});
    cmpRows+='</tr>';
  });

  body.innerHTML=`
   <div class="subgrid" style="margin-bottom:18px">
     <div class="stat"><div class="l">Lifetime Sales</div><div class="v" style="font-size:16px">${AED2(all.rev)}</div></div>
     <div class="stat"><div class="l">Lifetime GP</div><div class="v" style="font-size:16px">${AED2(all.pf)} · ${pct(all.gp)}</div></div>
     <div class="stat"><div class="l">Company Rank</div><div class="v">#${rank}<span style="font-size:12px;color:var(--ink-2)"> / ${CUST.length}</span></div></div>
     <div class="stat"><div class="l">Revenue Share</div><div class="v">${pct(all.rev/compTotal.rev)}</div></div>
     <div class="stat"><div class="l">Invoices</div><div class="v">${all.inv}</div></div>
     <div class="stat"><div class="l">Active Window</div><div class="v" style="font-size:12px">${first} → ${last}</div></div>
   </div>

   <div class="card" style="margin-bottom:16px"><div class="head"><h3><span class="hic">${SVG.chart}</span>Multi-Year Comparison — ${CUST[c]}</h3><span class="hint">Δ vs prior column</span></div>
     <div class="body pad0"><div class="tablescroll"><table class="cmp-tbl"><thead><tr><th>Metric</th>${stats.map(st=>`<th class="yr num">${st.y}</th>`).join('')}</tr></thead><tbody>${cmpRows}</tbody></table></div></div></div>

   <div class="card" style="margin-bottom:16px"><div class="head"><h3><span class="hic">${SVG.pnl}</span>Sales &amp; Gross Profit by Year</h3></div>
     <div class="body"><div class="chart-wrap"><canvas id="cCustCmp"></canvas></div></div></div>

   <div class="card"><div class="head"><h3><span class="hic">${SVG.invoice}</span>Invoice History</h3><span class="hint">${custRows.length} invoices</span></div><div class="body pad0"><div class="tablescroll" id="custInv"></div></div></div>`;

  // grouped comparison chart with data labels
  mkChart('cCustCmp',{type:'bar',data:{labels:stats.map(st=>String(st.y)),datasets:[
    {label:'Sales',data:stats.map(st=>st.s.rev),backgroundColor:PAL.accent(),borderRadius:5},
    {label:'Gross Profit',data:stats.map(st=>st.s.pf),backgroundColor:PAL.steel(),borderRadius:5}]},
    options:{maintainAspectRatio:false,layout:{padding:{top:22}},plugins:{legend:{position:'top',labels:{boxWidth:12}},datalabels:dl(),tooltip:{callbacks:{label:x=>x.dataset.label+': '+AED2(x.raw)}}},
      scales:{y:{...gridOpt(),ticks:{color:css('--ink-2'),callback:v=>kfmt(v)}},x:gridOpt()}}});

  // invoice table
  let ih='<table><thead><tr><th>Invoice</th><th>Date</th><th>Mode</th><th class="num">Amount</th><th class="num">Profit</th><th class="num">GP%</th></tr></thead><tbody>';
  custRows.slice(0,300).forEach(r=>{const gp=r[I.rev]?r[I.profit]/r[I.rev]:0;ih+=`<tr><td class="mono">${r[I.inv]}</td><td>${r[I.date]}</td><td>${MODES[r[I.m]]}</td><td class="num">${AED2(r[I.rev])}</td><td class="num ${r[I.profit]<0?'down':''}">${AED2(r[I.profit])}</td><td class="num">${pct(gp)}</td></tr>`;});
  ih+='</tbody></table>';$('#custInv').innerHTML=ih;
}

function renderPnl(){
  const p=$('#page-pnl');const ry=refYear(),py=ry-1;
  const cur=agg(rowsForYear(ry)),prev=agg(rowsForYear(py));
  const exp=STORE.read('expenses',[]);
  const opexBy=(year)=>{const heads={};exp.filter(e=>new Date(e.date).getFullYear()===year).forEach(e=>{heads[e.head]=(heads[e.head]||0)+(+e.total||0);});return heads;};
  const curHeads=opexBy(ry),prevHeads=opexBy(py);
  const curOpex=Object.values(curHeads).reduce((a,b)=>a+b,0),prevOpex=Object.values(prevHeads).reduce((a,b)=>a+b,0);
  const allHeads=[...new Set([...Object.keys(curHeads),...Object.keys(prevHeads)])];
  const curOp=cur.pf-curOpex,prevOp=prev.pf-prevOpex;
  function row(label,cv,pv,opts={}){const diff=cv-pv;const pc=pv?diff/pv:0;const good=opts.invert?diff<0:diff>0;const cls=diff===0?'flat':good?'up':'down';
    return `<tr class="${opts.bold?'pnl-bold':''}" style="${opts.bold?'font-weight:600':''}${opts.top?';border-top:2px solid var(--line)':''}">
      <td style="${opts.indent?'padding-left:30px':''}">${label}</td>
      <td class="num">${opts.pct?pct(cv):AED2(cv)}</td>
      <td class="num" style="color:var(--ink-2)">${opts.pct?pct(pv):AED2(pv)}</td>
      <td class="num ${cls}">${opts.pct?((diff*100).toFixed(1)+' pts'):AED(diff)}</td>
      <td class="num ${cls}">${prev.n?pctS(pc):'—'}</td></tr>`;}
  let heads='';allHeads.forEach(h=>{heads+=row(h,curHeads[h]||0,prevHeads[h]||0,{indent:true,invert:true});});
  if(!allHeads.length)heads=`<tr><td style="padding-left:30px;color:var(--neutral)" colspan="5">No operating expenses recorded — add them in <a onclick="navigate('expenses')" style="color:var(--accent);cursor:pointer">Operational Expenses</a> and they flow here automatically.</td></tr>`;

  p.innerHTML=`
   <div class="pagehead"><h2>Profit &amp; Loss — ${ry} vs ${py}</h2><p>Revenue &amp; COGS pulled live from sales data · operating expenses pulled from the Expenses module. Respects active filters.</p></div>
   <div class="card"><div class="body pad0"><table class="pnl">
     <thead><tr><th>Line item</th><th class="num">${ry}</th><th class="num">${py}</th><th class="num">Δ Abs</th><th class="num">Δ %</th></tr></thead>
     <tbody>
       ${row('Net Revenue',cur.rev,prev.rev,{bold:true})}
       ${row('Cost of Goods Sold',cur.cost,prev.cost,{indent:true,invert:true})}
       ${row('Gross Profit',cur.pf,prev.pf,{bold:true,top:true})}
       ${row('Gross Margin %',cur.gp,prev.gp,{pct:true,bold:true})}
       <tr><td colspan="5" style="background:var(--panel-2);font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600;padding:8px 14px">Operating Expenses</td></tr>
       ${heads}
       ${row('Total Operating Expenses',curOpex,prevOpex,{bold:true,invert:true,top:true})}
       ${row('Operating Profit',curOp,prevOp,{bold:true,top:true})}
       ${row('Operating Margin %',cur.rev?curOp/cur.rev:0,prev.rev?prevOp/prev.rev:0,{pct:true,bold:true})}
       ${row('Net Profit (before tax)',curOp,prevOp,{bold:true,top:true})}
     </tbody></table></div></div>
   <div class="grid g2" style="margin-top:16px">
     <div class="card"><div class="head"><h3>Gross Profit Trend</h3></div><div class="body"><div class="chart-wrap"><canvas id="cPnlGp"></canvas></div></div></div>
     <div class="card"><div class="head"><h3>Revenue vs COGS by Year</h3></div><div class="body"><div class="chart-wrap"><canvas id="cPnlRev"></canvas></div></div></div>
   </div>`;
  mkChart('cPnlGp',{data:{labels:YEARS,datasets:[{type:'line',label:'Gross Profit',data:YEARS.map(y=>agg(rowsForYear(y)).pf),borderColor:PAL.pos(),backgroundColor:'transparent',tension:.3,pointRadius:3},{type:'line',label:'GP %',yAxisID:'y1',data:YEARS.map(y=>agg(rowsForYear(y)).gp*100),borderColor:PAL.gold(),borderDash:[5,4],tension:.3,pointRadius:2}]},options:{maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:11}}},scales:{y:{...gridOpt(),ticks:{color:css('--ink-2'),callback:v=>(v/1e6).toFixed(1)+'M'}},y1:{position:'right',grid:{display:false},ticks:{color:css('--ink-2'),callback:v=>v.toFixed(0)+'%'}},x:gridOpt()}}});
  mkChart('cPnlRev',{type:'bar',data:{labels:YEARS,datasets:[{label:'Revenue',data:YEARS.map(y=>agg(rowsForYear(y)).rev),backgroundColor:PAL.accent(),borderRadius:4},{label:'COGS',data:YEARS.map(y=>agg(rowsForYear(y)).cost),backgroundColor:css('--neg-soft'),borderColor:PAL.neg(),borderWidth:1,borderRadius:4}]},options:{maintainAspectRatio:false,layout:{padding:{top:20}},plugins:{legend:{position:'top',labels:{boxWidth:11}},datalabels:dl(),tooltip:{callbacks:{label:c=>c.dataset.label+': '+AED2(c.raw)}}},scales:{y:{...gridOpt(),ticks:{color:css('--ink-2'),callback:v=>(v/1e6).toFixed(1)+'M'}},x:gridOpt()}}});
}

const EXP_HEADS_DEFAULT=['Other Expenses','IT & Internet Expenses','Bank Charges','Annual Licence & Registration Fee'];
function renderExpenses(){
  const p=$('#page-expenses');const exp=STORE.read('expenses',[]);

function renderCashflow(){
  const p=$('#page-cashflow');const banks=STORE.read('banks',[]);const exp=STORE.read('expenses',[]);
  const cash=banks.reduce((a,b)=>a+(+b.current||0),0);
  const flows=STORE.read('cashflows',[]);
  const inflow=flows.filter(f=>f.dir==='in').reduce((a,f)=>a+(+f.actual||f.expected||0),0);
  const outflow=flows.filter(f=>f.dir==='out').reduce((a,f)=>a+(+f.actual||f.expected||0),0);
  // avg monthly opex from expense ledger
  const months=new Set(exp.map(e=>e.date.slice(0,7)));const avgOpex=months.size?exp.reduce((a,e)=>a+(+e.total||0),0)/months.size:0;
  const net=inflow-outflow;const runway=avgOpex>0?(cash/avgOpex):null;
  p.innerHTML=`
   <div class="pagehead"><h2>Cash Flow Control</h2><p>Liquidity position drawn from Bank Management, obligations from the Expense ledger, plus manual inflow/outflow forecasting.</p></div>
   <div class="kpigrid">
     ${kpi('Available Cash',AED2(cash),`<span class="delta flat">${banks.length} bank(s)</span>`)}
     ${kpi('Recorded Inflows',AED2(inflow),'<span class="delta flat">manual + collections</span>')}
     ${kpi('Recorded Outflows',AED2(outflow),'<span class="delta flat">payments + costs</span>')}
     ${kpi('Net Cash Flow',AED2(net),`<span class="delta ${net>=0?'up':'down'}">${net>=0?'▲ surplus':'▼ deficit'}</span>`)}
     ${kpi('Cash Runway',runway==null?'—':(net>=0?'∞':runway.toFixed(1)+' mo'),`<span class="delta flat">${avgOpex>0?'avg opex '+AED2(avgOpex)+'/mo':'add expenses'}</span>`)}
   </div>
   ${net>=0&&runway!=null?'<div class="notice">✓ Net cash flow is positive — runway is not currently constrained.</div>':''}
   <div style="margin-bottom:14px"><button class="btn pri" onclick="cfForm()">+ Add Cash Movement</button></div>
   <div class="card"><div class="head"><h3>Cash Movements</h3></div><div class="body pad0">${flows.length?`<div class="tablescroll"><table><thead><tr><th>Date</th><th>Direction</th><th>Category</th><th>Party</th><th class="num">Expected</th><th class="num">Actual</th><th>Status</th><th></th></tr></thead><tbody>${flows.slice().sort((a,b)=>a.date<b.date?1:-1).map(f=>`<tr><td>${f.date}</td><td><span class="pill ${f.dir==='in'?'pos':'neg'}">${f.dir==='in'?'Inflow':'Outflow'}</span></td><td>${f.cat}</td><td>${f.party||''}</td><td class="num">${AED2(+f.expected||0)}</td><td class="num">${f.actual?AED2(+f.actual):'—'}</td><td>${f.status||'Pending'}</td><td><button class="btn sm danger" onclick="delCf('${f.id}')">✕</button></td></tr>`).join('')}</tbody></table></div>`:emptyState('≋','No cash movements yet','Forecast expected inflows (customer collections, funding) and outflows (supplier payments, salaries, rent) to build a live runway.','Add Movement','cfForm()')}</div></div>`;
}

  const summary=[['Report','Filtered Sales Export'],['Generated',new Date().toLocaleString()],['Records',rows.length],['Revenue',agg(rows).rev],['COGS',agg(rows).cost],['Gross Profit',agg(rows).pf],['Gross %',(agg(rows).gp*100).toFixed(1)+'%'],['Filters',$('#filtSummary').textContent.trim()]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(summary),'Summary');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows.map(r=>({Invoice:r[I.inv],Date:r[I.date],Customer:CUST[r[I.c]],Mode:MODES[r[I.m]],Salesperson:SP[r[I.s]],Revenue:r[I.rev],COGS:r[I.cost],Profit:r[I.profit]}))),'Detail');
  XLSX.writeFile(wb,'Sales_Filtered_Export.xlsx');toast('Filtered export ready','ok');}

/* ============================================================
   MODALS + CONFIRM
   ============================================================ */
function openModal(title,bodyHtml,onSave,saveLabel){const m=$('#modal');
  m.innerHTML=`<div class="mhead"><h3 style="font-family:'Sora';font-size:15px">${title}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="mbody">${bodyHtml}</div><div class="mfoot">${onSave?`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn pri" id="modalSave">${saveLabel||'Save'}</button>`:`<button class="btn pri" onclick="closeModal()">${saveLabel||'Close'}</button>`}</div>`;
  $('#modalBg').classList.add('open');if(onSave)$('#modalSave').onclick=onSave;}
function closeModal(){$('#modalBg').classList.remove('open');}
$('#modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
function confirmAction(msg,fn){openModal('Confirm',`<p style="font-size:14px">${msg}</p>`,()=>{fn();closeModal();},'Confirm');}
function emptyState(ico,h,p,btn,fn){return `<div class="empty"><div class="ico">${ico}</div><h4>${h}</h4><p>${p}</p>${btn?`<button class="btn pri" onclick="${fn}">+ ${btn}</button>`:''}</div>`;}

/* ============================================================
   NAV + RENDER
   ============================================================ */
const TITLES={exec:['Dashboard','Company-wide sales & profitability'],customers:['Customer Analysis','Per-customer performance & YoY'],salespeople:['Salesperson Performance','Rep leaderboard & margin quality'],pnl:['Profit & Loss','Dynamic P&L from live data'],expenses:['Operational Expenses','Editable cost ledger'],banks:['Bank Management','Balances & daily ledger'],cashflow:['Cash Flow Control','Liquidity & runway'],data:['Data & Audit','Model, cleaning log & exports']};
let currentPage='exec';
function navigate(page){currentPage=page;
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.page===page));
  document.querySelectorAll('.page').forEach(pg=>pg.classList.remove('active'));$('#page-'+page).classList.add('active');
  $('#pageTitle').childNodes[0].nodeValue=TITLES[page][0];$('#pageSub').textContent=TITLES[page][1];
  const filtersHidden=['expenses','banks','cashflow','data'].includes(page);
  document.querySelectorAll('.filterbar').forEach(f=>f.style.display=filtersHidden?'none':'flex');
  document.getElementById('side').classList.remove('open');
  render();}
function render(){
  filterSummary();$('#recChip').textContent=num(filtered().length)+' invoices in scope';
  if(currentPage==='exec')renderExec();
  else if(currentPage==='customers')renderCustomers();
  else if(currentPage==='salespeople')renderSalespeople();
  else if(currentPage==='pnl')renderPnl();
  else if(currentPage==='expenses')renderExpenses();
  else if(currentPage==='banks')renderBanks();
  else if(currentPage==='cashflow')renderCashflow();
  else if(currentPage==='data')renderData();
}
document.getElementById('nav').addEventListener('click',e=>{const a=e.target.closest('a');if(a)navigate(a.dataset.page);});
$('#exportBtn').onclick=()=>{if(['exec','customers','salespeople','pnl'].includes(currentPage))currentExport();else if(currentPage==='data')exportCleaned();else backupData();};
$('#themeBtn').onclick=()=>{const h=document.documentElement;const dark=h.getAttribute('data-theme')==='dark';h.setAttribute('data-theme',dark?'light':'dark');STORE.write('theme',dark?'light':'dark');render();};

/* ---------- boot ---------- */
(function boot(){
  const t=STORE.read('theme','light');document.documentElement.setAttribute('data-theme',t);
  $('#foot').innerHTML=`<b>${num(ROWS.length)}</b> invoices loaded<br>Source: ${DB.meta.source}<br>Cleaned: ${DB.meta.generated}`;
  initLogo();initFilters();navigate('exec');var bs=document.getElementById('bootScreen');if(bs)bs.style.display='none';
})();

} /* end startApp */

/* ---- data loader: works on GitHub Pages and any static host ---- */
(function(){
  fetch('./data.json',{cache:'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ window.__DATA=d; try{ startApp(); }catch(e){ bootError('Startup error: '+e.message); console.error(e); } })
    .catch(function(e){ bootError('Could not load data.json ('+e.message+').'); });
  function bootError(msg){
    var s=document.getElementById('bootScreen');
    if(s){ s.innerHTML='<div class="boot-card"><b>Dashboard could not start</b>'
      +'<p>'+msg+'</p>'
      +'<p class="hint">Opening the file directly? Browsers block local file reads for security. Serve the folder instead:</p>'
      +'<code>python -m http.server</code>'
      +'<p class="hint">then open <b>http://localhost:8000</b> — or push to GitHub Pages, where data.json loads automatically.</p></div>'; }
  }
})();
</script>
